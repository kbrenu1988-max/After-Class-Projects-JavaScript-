<html>

    <script>

        var choice = prompt("Welcome to Area Calculator. \n Please enter your choice.\n1.Perimeter of a Rectangle.\n2.Perimeter of a Triangle.\n3.Perimeter of a Circle.\n4.Perimeter of a Parallelogram");

        if (choice == '1') {
            var l = prompt('Enter the length')
            var b = prompt('Enter the breadth')
            var result = 2 * Number(l) + Number(b)
            alert('The Area is ' + result)
        }

        if (choice == '2') {
            var h = prompt('Enter the value of side 1')
            var b = prompt('Enter the value of base')
            var t = prompt('Enter the value of side 2')
            var result = Number(h) + Number(b) + Number(t)
            alert('The Perimeter is ' + result)
        }

        if (choice == '3') {
            var r = prompt('Enter the radius')
            var result = 2 * Math.PI * Number(r)
            alert('The Perimeter is ' + result)
        }

        if (choice == '4') {
            var h = prompt('Enter the side')
            var cb = prompt('Enter the side')
            var result = 2 * Number(h) * Number(cb)
            alert('The Perimeter is ' + result)
        }
    </script>

</html>
