<html>
    <body>
        <div class="date-container">
        <!-- JavaScript will inject the formatted text inside these tags -->
        <h1 id="display-date"></h1>
        <p id="display-day-year"></p>
    </div>
    </body>

    <script>

        function displayCurrentDate() {
    const now = new Date();

    const dateNum = now.getDate(); 
    const year = now.getFullYear(); 


    const dayName = now.toLocaleDateString('en-US', { weekday: 'long' });

    // 4. Get the Month name
    const monthName = now.toLocaleDateString('en-US', { month: 'long' });

    document.getElementById('display-date').textContent = `${monthName} ${dateNum}`;
    document.getElementById('display-day-year').textContent = `${dayName}, ${year}`;
}

displayCurrentDate();

    </script>
</html>
