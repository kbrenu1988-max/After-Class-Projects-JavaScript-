<html>
    <head>

        <style>

            body, html {
                color: #666;
                background-color: #b6f8ef;
            }
            
            .topnav {
                overflow: hidden;
                background-color: #333;
            }
            
            .topnav a {
                display: inline;
                color: #1affa3;
                text-align: center;
                padding: 14px 16px;
                text-decoration: none;
            }
            
            .topnav a:hover {
                background-color: #111;
            }
            
            .ping1, .ping2, .ping3 {
                position: relative;
                opacity: 0.9;
                background-repeat: no-repeat;
            }
            
            .section {
                text-align: center;
                padding: 50px 80px;
            }
            
            .section-light {
                background-color: #f4f4f4;
                color: #666666;
            }
            
            .section-dark {
                background-color: #282e34;
                color: #ddd;
            }

        </style>

    </head>

    <body>
        
        <div class="topnav">

            <a class="active" href="#home">Home</a>
            <a href="#">About_Us</a>
            <a href="#">Gallery</a>
            <a href="#">Services</a>
            <a href="#">Offer</a>
            <a href="contact us.html">Contact_Us</a>

        </div>

        <section>
            
            <img class="mySlides" src="image1.jpe">
            <img class="mySlides" src="image2.jpe">
            <img class="mySlides" src="image3.jpg">
        
        </section>
        
        <script>
        
        var myIndex = 0;
        carousel();
        
        function carousel() {
            var x = document.getElementsByClassName("mySlides");
            for (i = 0; i < x.length; i++) {
                x[i].style.display = "none";
            }
            
            myIndex++;
            
            if (myIndex > x.length) {myIndex = 1}
            x[myIndex-1].style.display = "block";
            setTimeout(carousel, 3000);
            }
            
            </script>

    </body>

</html>
