<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Counter App</title>
</head>
<body>

    <div class="counter-container">
        <h1>Counter App</h1>
        <div id="counter-value">0</div>
        
        <div class="button-group">
            <button id="decrement-btn" class="btn">Decrement</button>
            <button id="reset-btn" class="btn">Reset</button>
            <button id="increment-btn" class="btn">Increment</button>
        </div>
    </div>

    <script>
        // Initialize the counter variable
let count = 0;

// Grab references to the HTML elements
const counterValue = document.getElementById('counter-value');
const decrementBtn = document.getElementById('decrement-btn');
const resetBtn = document.getElementById('reset-btn');
const incrementBtn = document.getElementById('increment-btn');

// Function to update the DOM display
function updateDisplay() {
    counterValue.textContent = count;
}

// Event listener for Increment button
incrementBtn.addEventListener('click', () => {
    count++;
    updateDisplay();
});

// Event listener for Decrement button
decrementBtn.addEventListener('click', () => {
    count--;
    updateDisplay();
});

// Event listener for Reset button
resetBtn.addEventListener('click', () => {
    count = 0;
    updateDisplay();
});

    </script>
</body>
</html>
